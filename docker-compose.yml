# Levanta el simulador con un solo comando: `docker compose up --build`.
#
# config/ y data/ se montan como bind mounts (no volúmenes nombrados) a propósito: config/ es
# donde el usuario coloca minos-public-cert.pem a mano (ver README "Configurar"), y data/ es donde
# quiere poder inspeccionar directamente banxicosim.mv.db con un cliente H2 sin entrar al
# contenedor.
services:
  banxico-simulator:
    build: .
    container_name: banxico-simulator
    ports:
      - "6001:6001"   # SPEI -- minos apunta aquí
      - "6002:6002"   # ARA -- intercambio de certificados
      - "8089:8089"   # API de control HTTP -- ver httpclient/
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      # Sobreescribe cualquier clave de simulator.properties sin tener que montar el archivo --
      # ver SimConfig.applyEnvironmentOverrides. Ejemplos, descomenta lo que necesites:
      # SPEI_PORT: "6001"
      # MINOS_ENTITY_CODE: "90646"
      # MINOS_ENTITY_NAME: "MINOS-DEV"
      TZ: "America/Mexico_City"
    restart: unless-stopped

  # Servidor MCP (spec 011) en modo HTTP, junto a la API: el plugin de Claude Code solo apunta a
  # http://<host>:8090/mcp, sin clonar el repo ni instalar Node. Habla con la API por la red
  # interna de compose, así que no depende del puerto publicado 8089.
  banxico-simulator-mcp:
    build: ./mcp-server
    container_name: banxico-simulator-mcp
    ports:
      - "8090:8090"   # MCP (Streamable HTTP) -- endpoint /mcp
    environment:
      SIMULATOR_URL: "http://banxico-simulator:8089"
      TZ: "America/Mexico_City"
    depends_on:
      banxico-simulator:
        condition: service_healthy
    restart: unless-stopped
